version: 1
frontend:
  phases:
    preBuild:
      commands:
        - npm ci
    build:
      commands:
        # Amplify only exposes console-configured environment variables to
        # the build step by default — Next.js server routes (API routes,
        # proxy.ts) read process.env at actual request time, which is a
        # separate runtime. Writing them into .env.production here is what
        # makes them available there too.
        # https://docs.aws.amazon.com/amplify/latest/userguide/ssr-environment-variables.html
        - env | grep -Ee 'DASHBOARD_|OPENAI_' >> .env.production
        # Runs once per deploy, before the new build ships, using the
        # DASHBOARD_DATABASE_URL configured in the Amplify console. This is
        # deliberately NOT run at app/Lambda startup — SSR runs as multiple
        # concurrent Lambda instances, which would race to apply the same
        # migration.
        - npm run db:migrate:ci
        - npm run build
  artifacts:
    baseDirectory: .next
    files:
      - "**/*"
  cache:
    paths:
      - node_modules/**/*
      - .next/cache/**/*
